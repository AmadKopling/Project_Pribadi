<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bejalanan.com – Rencanakan Liburanmu</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav class="navbar bg-primary border-bottom ">
        <div class="container flex-wrap">
        <a class="navbar-brand fw-bold" href="#">Bejalanan.com</a>
        <div class="card bg-body">
            <ul class="nav">
            <li class="nav-item"><a class="nav-link text-black" href="index.html">Back Home</a></li>
            
            </ul>
        </div>
        </div>
    </nav> 
    <main class="container py-5 flex-grow-1">
        <section class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <h1 class="h3 fw-bold mb-1">Pembayaran</h1>
                <p class="text-body-secondary mb-4">Isi data di bawah untuk melanjutkan pesanan.</p>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div id="ringkasan" class="alert alert-info"></div>
                        <form id="pay">
                            <div class="mb-3">
                                <label for="nama" class="form-label fw-semibold">Nama lengkap</label>
                                <input id="nama" type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input id="email" type="email" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="metode" class="form-label fw-semibold">Metode pembayaran</label>
                                <select id="metode" class="form-select" required>
                                    <option value="">Pilih metode</option>
                                    <option>Transfer bank (virtual account)</option>
                                    <option>E-wallet</option>
                                    <option>QRIS</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">Bayar sekarang</button>
                        </form>

                        <div id="sukses" class="alert alert-success mt-3 mb-0 d-none" role="alert">
                            Pesanan diterima.
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="border-bottom bg-body py-4 text-center text-body-secondary small mt-auto">
        Bejalanan.com · halaman untuk pembayaran
    </footer>
    <script src="bayar.js"></script>
</body>
</html>
