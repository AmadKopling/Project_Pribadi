<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pembayaran Berhasil – Bejalanan.com</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100">
  <nav class="navbar bg-primary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Bejalanan.com</a>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    <div class="col-md-8 col-lg-6 mx-auto text-center">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="display-1 text-success">✓</div>
          <h1 class="h3 fw-bold">Pembayaran Berhasil!</h1>
          <p class="text-body-secondary">Terima kasih, <span id="nama"></span>. Pesananmu sudah diterima.</p>
          <div id="ringkasan" class="alert alert-success"></div>
          <a href="branda.html" class="btn btn-primary rounded-pill px-4">Kembali ke beranda</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-bottom bg-body py-4 text-center text-body-secondary small mt-auto">
    Bejalanan.com · pembayaran sukses
  </footer>

  <script>
    const rp = n => "Rp" + Math.round(n).toLocaleString("id-ID");
    let p = null, b = null;
    try {
      p = JSON.parse(localStorage.getItem("pesanan"));
      b = JSON.parse(localStorage.getItem("pembayaran"));
    } catch (e) {}

    nama.textContent = b ? b.nama : "";
    ringkasan.textContent = p
      ? `${p.destinasi} · ${p.kelas} · ${p.hari} hari · ${p.orang} orang — Total ${rp(p.total)}`
      : "Tidak ada data pesanan.";
  </script>
</body>
</html>
