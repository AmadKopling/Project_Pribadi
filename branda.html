<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bejalanan.com – Rencanakan Liburanmu</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar bg-primary border-bottom ">
    <div class="container flex-wrap">
      <a class="navbar-brand fw-bold" href="#">Bejalanan.com</a>
      <div class="card bg-body">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-black" href="#destinasi">Destinasi</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="#biaya">Hitung biaya</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="#tips">Tips</a></li>
          <li class="nav-item"><a class="nav-link text-black" href="#Fasilitas">Fasilitas</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <header class="container py-5">
      <!-- SLIDER FOTO -->
    <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <div class="slot hero-foto"><img src="raja ampat.jpg" alt="Raja Ampat"></div>
          <a href="#biaya" class="btn btn-kontak">Hitung biaya</a>
        </div>
        <div class="carousel-item">
          <div class="slot hero-foto"><img src="labuan bajo.jpg" alt="Labuan Bajo"></div>
          <a href="#biaya" class="btn btn-kontak">Hitung biaya</a>
        </div>
        <div class="carousel-item">
          <div class="slot hero-foto"><img src="ubud.jpg" alt="Ubud"></div>
          <a href="#biaya" class="btn btn-kontak">Hitung biaya</a>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span><span class="visually-hidden">Sebelumnya</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span><span class="visually-hidden">Berikutnya</span>
      </button>
    </div>

    <!-- BANNER PENAWARAN -->
    <section class="banner py-4">
      <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
        <h2 class="h3 mb-0 fw-normal">Rekomendasi Destinasi Favorit</h2>
        <a class="btn btn-outline-light px-4" href="#destinasi">Lihat destinasi lainnya</a>
      </div>
    </section>
  </header>
</body>
</html>
